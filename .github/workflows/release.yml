name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift run CCBeaconTests

  release:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}

      - name: Bump Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TARBALL="https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
          SHA256=$(curl -sL "$TARBALL" | shasum -a 256 | awk '{print $1}')

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/hosseintoussi/homebrew-ccbeacon.git" /tmp/tap
          cd /tmp/tap

          sed -i '' "s|url \".*\"|url \"${TARBALL}\"|"     Formula/ccbeacon.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/ccbeacon.rb

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add Formula/ccbeacon.rb
          git diff --cached --quiet || git commit -m "ccbeacon ${{ github.ref_name }}"
          git push
