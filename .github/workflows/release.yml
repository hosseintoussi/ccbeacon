name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find version tag on this commit
        id: tag
        run: |
          TAG=$(git tag --points-at ${{ github.event.workflow_run.head_sha }} | grep -E '^v[0-9]' | head -1)
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        if: steps.tag.outputs.name != ''
        id: changelog
        run: |
          VERSION="${{ steps.tag.outputs.name }}"
          VERSION="${VERSION#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build universal binary
        if: steps.tag.outputs.name != ''
        id: dist
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          swift build -c release --arch arm64 --arch x86_64
          mkdir dist
          cp .build/apple/Products/Release/ccbeacon ccbeacon.sh dist/
          tar -czf "ccbeacon-${TAG}-macos.tar.gz" -C dist ccbeacon ccbeacon.sh
          echo "sha=$(shasum -a 256 ccbeacon-${TAG}-macos.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.tag.outputs.name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          body: ${{ steps.changelog.outputs.notes }}
          files: ccbeacon-*.tar.gz

      - name: Bump Homebrew formula
        if: steps.tag.outputs.name != ''
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          TARBALL="https://github.com/${{ github.repository }}/releases/download/${TAG}/ccbeacon-${TAG}-macos.tar.gz"
          SHA256="${{ steps.dist.outputs.sha }}"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/hosseintoussi/homebrew-ccbeacon.git" /tmp/tap
          cd /tmp/tap

          sed -i '' "s|url \".*\"|url \"${TARBALL}\"|"     Formula/ccbeacon.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/ccbeacon.rb

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add Formula/ccbeacon.rb
          git diff --cached --quiet || git commit -m "ccbeacon ${TAG}"
          git push
